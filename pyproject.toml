[project]
name = "attendance-capture"
version = "0.1.0"
description = "Phase 1: live capture, face detection and identification pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2.3",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.18",
    "insightface>=0.7.3",
    "pgvector>=0.3",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
attendance = "attendance.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attendance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
